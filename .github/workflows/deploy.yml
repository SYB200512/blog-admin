# blog-admin：构建后台管理端并上传到云服务器
# 触发：push 到 main，或手动 Run workflow
# 需要的 Secrets：SERVER_HOST / SERVER_USER(ubuntu) / SERVER_SSH_KEY
# 静态文件是 bind mount，上传后 Nginx 立即生效，无需重启

name: Deploy Admin

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15          # 防止网络问题导致无限挂起
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        run: npm ci

      - name: 构建后台 (vite build → dist/)
        run: npm run build

      - name: 上传 dist 到 /opt/blog/admin_dist（带重试）
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          echo "$KEY" > /tmp/ssh_key
          chmod 600 /tmp/ssh_key
          for i in 1 2 3 4 5; do
            echo "== 上传尝试 $i =="
            if scp -i /tmp/ssh_key -r -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                   -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=6 \
                   dist/* "${USER}@${HOST}:/opt/blog/admin_dist/"; then
              echo "上传成功"; break
            else
              echo "尝试 $i 失败，20 秒后重试"; sleep 20
            fi
          done
